name: Weekly Report

# Emails the weekly channel-growth report every Monday. The daily short moved to
# Actions in f8f2cbf "so it no longer depends on the laptop being awake"; this
# finishes that migration — the report was left behind on a Windows scheduled
# task and silently stopped running once the laptop stopped being the host.

on:
  schedule:
    # UTC — GitHub cron does NOT observe DST. 08:30 UTC = 09:30 UK in summer
    # (BST), 08:30 in winter (GMT). Offset from the 08:00 daily-short job so the
    # two don't queue against each other. Cron also fires 5-15 min late.
    - cron: "30 8 * * 1"
  workflow_dispatch:

# Deliberately no pull_request trigger: a fork PR must never see these secrets.
permissions:
  contents: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[youtube]"

      - name: Materialize OAuth files
        env:
          CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          REPORT_TOKEN_JSON: ${{ secrets.YOUTUBE_REPORT_TOKEN_JSON }}
        run: |
          mkdir -p .secrets
          printf '%s' "$CLIENT_SECRETS_JSON" > .secrets/client_secrets.json
          printf '%s' "$REPORT_TOKEN_JSON" > .secrets/youtube_report_token.json
          # An unset secret writes an empty file. Say so here rather than letting
          # the run fail later with a vaguer message.
          for name in client_secrets youtube_report_token; do
            if [ ! -s ".secrets/$name.json" ]; then
              echo "::error::.secrets/$name.json is empty — the matching repository secret is not set."
              exit 1
            fi
          done

      - name: Build + email the report
        env:
          YOUTUBE_CLIENT_SECRETS: .secrets/client_secrets.json
          # Optional: lifetime totals + video titles, read as PUBLIC data with an
          # API key rather than the sensitive youtube.readonly OAuth scope. The
          # report drops the totals block if these are absent.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          REPORT_SMTP_USERNAME: ${{ secrets.REPORT_SMTP_USERNAME }}
          REPORT_SMTP_PASSWORD: ${{ secrets.REPORT_SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python -m shorts.analytics --log-level INFO

      # reports/ is gitignored, so this artifact is the only archived copy —
      # and it survives a send failure, keeping a failed run diagnosable.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/**
          if-no-files-found: warn
